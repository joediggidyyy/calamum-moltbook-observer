[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calamum-moltbook-observer"
version = "0.1.0"
description = "Observer-native CLI and runtime operations for Calamum Moltbook Observer"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
	"psutil",
	"requests",
]

[project.optional-dependencies]
ds = [
	"apexlab>=1.2.0",
	"joblib",
	"matplotlib",
	"pandas",
	"seaborn",
]
dashboard = [
	"nicegui",
]
dev = [
	"pytest",
]

[project.scripts]
observerctl = "observerctl:main"

[tool.setuptools]
py-modules = [
	"calamum_config",
	"calamum_keepalive",
	"calamum_librarian",
	"calamum_observer_agent",
	"calamum_sampler",
	"calamum_watchdog",
	"keysmith",
	"moltbook_client",
	"obfuscator_lib",
	"observerctl",
	"observerctl_sandbox_registry",
	"observerctl_sandbox_render",
	"observerctl_sandbox_runs",
	"observerctl_terminal",
	"ops_dashboard",
	"sentinel",
	"stage4_features",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["analysis*", "ops*", "simulation*"]

[tool.setuptools.package-dir]
"" = "src"
